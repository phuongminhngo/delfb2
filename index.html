textarea{width:100%;min-height:340px;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:14px;resize:vertical}

ul{padding-left:20px;margin:6px 0 12px}

const CO=[
{id:"co1",titre:"Le télétravail et les villes moyennes",type:"Reportage radio",ecoutes:2,segs:[
["A","Depuis quelques années, de nombreux cadres quittent les grandes métropoles pour s'installer dans des villes moyennes. À Mâcon, Périgueux ou Laval, les agences immobilières constatent une hausse nette des demandes venant de Parisiens. Pour la plupart, ce départ n'aurait pas été envisageable sans le télétravail : ils conservent leur poste et ne se rendent au bureau qu'un ou deux jours par semaine. Les élus locaux s'en réjouissent, car ces nouveaux habitants font vivre les commerces et remplissent les écoles. Mais tout le monde ne partage pas cet enthousiasme. Dans certaines communes, les prix des logements ont augmenté de près de quinze pour cent en trois ans, et les jeunes du coin peinent désormais à se loger. Par ailleurs, les sociologues rappellent que ce phénomène reste minoritaire : il concerne surtout des professions qualifiées, et la majorité des actifs n'a pas la possibilité de travailler à distance."]],
qs:[
{q:"Qui s'installe principalement dans les villes moyennes ?",o:["Des retraités","Des cadres venant de Paris","Des étudiants étrangers"],a:1},
{q:"Qu'est-ce qui a rendu ce départ possible ?",o:["Le télétravail","La baisse des loyers à Paris","De nouvelles lignes de train"],a:0},
{q:"Pourquoi les élus locaux sont-ils satisfaits ?",o:["Les impôts locaux augmentent","Les commerces et les écoles en profitent","Les jeunes restent dans la région"],a:1},
{q:"Quelle conséquence négative est mentionnée ?",o:["Les jeunes du coin ont du mal à se loger","Les commerces ferment","Les transports sont saturés"],a:0},
{q:"De combien les prix ont-ils augmenté dans certaines communes ?",o:["D'environ 5 % en un an","D'environ 15 % en trois ans","D'environ 30 % en cinq ans"],a:1},
{q:"Selon les sociologues, ce phénomène…",o:["concerne la majorité des actifs","reste limité à certaines professions","va bientôt s'arrêter"],a:1}]},

{id:"co2",titre:"Une application contre le gaspillage",type:"Interview",ecoutes:1,segs:[
["A","Bonjour Claire Martin. Vous avez fondé une application qui permet aux commerçants de vendre leurs invendus à prix réduit. Comment l'idée vous est-elle venue ?"],
["B","Tout simplement en travaillant dans une boulangerie pendant mes études. Chaque soir, on jetait des dizaines de viennoiseries parfaitement mangeables. Je trouvais ça absurde, et surtout, personne ne semblait s'en émouvoir."],
["A","Aujourd'hui, combien de commerces utilisent votre service ?"],
["B","Un peu plus de trois mille, principalement des boulangeries et des primeurs. Les supermarchés sont plus difficiles à convaincre, car ils ont déjà leurs propres circuits, notamment les dons aux associations."],
["A","Certains vous reprochent de faire du profit sur un problème écologique. Que leur répondez-vous ?"],
["B","Je comprends la critique, mais je crois qu'une entreprise peut être rentable et utile en même temps. Si nous n'étions pas viables économiquement, nous aurions disparu depuis longtemps, et les invendus continueraient d'aller à la poubelle. Cela dit, nous ne remplaçons pas les associations : nous sommes complémentaires."],
["A","Et pour l'avenir ?"],
["B","Nous voulons surtout sensibiliser. Le gaspillage le plus important ne vient pas des magasins, mais des foyers. C'est là que les habitudes doivent changer."]],
qs:[
{q:"D'où vient l'idée de l'application ?",o:["D'un reportage télévisé","D'un emploi étudiant dans une boulangerie","D'une association où elle était bénévole"],a:1},
{q:"Pourquoi les supermarchés sont-ils difficiles à convaincre ?",o:["Ils n'ont pas d'invendus","Ils ont déjà leurs propres solutions","L'application est trop chère"],a:1},
{q:"Comment répond-elle à la critique sur le profit ?",o:["Elle reconnaît que c'est un problème","Elle affirme qu'on peut être rentable et utile","Elle dit que l'entreprise ne fait pas de profit"],a:1},
{q:"Quelle relation a l'entreprise avec les associations ?",o:["Elle les remplace","Elle est en concurrence avec elles","Elle est complémentaire"],a:2},
{q:"Selon elle, d'où vient le gaspillage le plus important ?",o:["Des restaurants","Des magasins","Des foyers"],a:2}]},

{id:"co3",titre:"Le bilinguisme et le cerveau",type:"Extrait de conférence",ecoutes:2,segs:[
["A","Pendant longtemps, on a cru que grandir avec deux langues ralentissait le développement de l'enfant. On craignait une forme de confusion. Les recherches menées depuis une trentaine d'années ont largement démenti cette idée. Les enfants bilingues peuvent, certes, avoir un vocabulaire un peu moins étendu dans chacune de leurs langues prise séparément, mais si l'on additionne les deux, ils ne sont absolument pas en retard. Plus intéressant encore, plusieurs études ont suggéré que le fait de passer constamment d'une langue à l'autre entraînerait certaines capacités d'attention. Je dois toutefois être honnête avec vous : ces résultats font aujourd'hui débat. Des études plus récentes, menées sur des échantillons beaucoup plus larges, n'ont pas toujours retrouvé cet avantage. Ce qui, en revanche, ne fait guère de doute, ce sont les bénéfices sociaux et culturels : l'accès à d'autres cultures, à d'autres façons de penser, et, plus tard, à davantage d'opportunités professionnelles."]],
qs:[
{q:"Que croyait-on autrefois au sujet du bilinguisme ?",o:["Qu'il ralentissait le développement de l'enfant","Qu'il rendait l'enfant plus intelligent","Qu'il n'avait aucun effet"],a:0},
{q:"Que dit le conférencier sur le vocabulaire des enfants bilingues ?",o:["Il est plus riche dans chaque langue","Il est plus réduit dans chaque langue, mais pas au total","Il est identique à celui des monolingues"],a:1},
{q:"L'avantage sur les capacités d'attention…",o:["est prouvé de façon certaine","est aujourd'hui discuté","n'a jamais été étudié"],a:1},
{q:"Pourquoi les études récentes ont-elles plus de poids ?",o:["Elles portent sur des échantillons plus larges","Elles sont plus courtes","Elles ont été faites à l'étranger"],a:0},
{q:"Qu'est-ce qui ne fait guère de doute ?",o:["L'avantage cognitif","Les bénéfices sociaux et culturels","Le retard scolaire"],a:1}]},

{id:"co4",titre:"Bulletin d'informations",type:"Flash info",ecoutes:1,segs:[
["A","Voici les titres de ce matin. La grève des contrôleurs aériens se poursuit pour la deuxième journée consécutive : près d'un vol sur trois est annulé au départ de Lyon et de Marseille, et les autorités recommandent aux voyageurs de vérifier l'état de leur vol avant de se rendre à l'aéroport. En Bretagne, un nouveau parc éolien en mer a été inauguré hier. Il devrait couvrir les besoins en électricité d'environ huit cent mille habitants, mais des associations de pêcheurs dénoncent toujours son impact sur leur activité. Enfin, culture : le musée des Beaux-Arts de Bordeaux rouvre ses portes après deux ans de travaux. L'entrée sera gratuite pendant tout le premier week-end."]],
qs:[
{q:"Quelle proportion de vols est annulée ?",o:["Un sur deux","Un sur trois","Un sur dix"],a:1},
{q:"Que conseille-t-on aux voyageurs ?",o:["De prendre le train","De vérifier leur vol avant de partir","De se faire rembourser"],a:1},
{q:"Le parc éolien devrait alimenter environ…",o:["80 000 habitants","800 000 habitants","8 millions d'habitants"],a:1},
{q:"Qui critique ce projet ?",o:["Des pêcheurs","Des touristes","Des élus locaux"],a:0},
{q:"Que se passe-t-il au musée de Bordeaux ?",o:["Il ferme pour travaux","Il rouvre avec l'entrée gratuite le premier week-end","Il accueille une exposition étrangère"],a:1}]},

{id:"co5",titre:"La semaine de quatre jours",type:"Débat radio",ecoutes:1,segs:[
["A","Les expériences menées dans plusieurs pays sont assez claires : dans la majorité des entreprises testées, la productivité s'est maintenue, et les salariés se disent moins stressés. On constate aussi une baisse de l'absentéisme."],
["B","Je ne conteste pas ces chiffres, mais ils concernent surtout des entreprises de services, avec des employés de bureau. Dans mon secteur, la restauration, si je ferme un jour de plus, je perds du chiffre d'affaires. Et si je reste ouvert, il me faut embaucher, ce que je n'ai pas les moyens de faire."],
["A","C'est vrai que le modèle ne peut pas s'appliquer partout de la même manière. Mais on pourrait imaginer des rotations, chacun ayant son jour de repos à un moment différent de la semaine."],
["B","Sur le papier, oui. Dans la réalité, avec une équipe de six personnes, l'organisation devient un casse-tête. Je pense qu'il faut laisser les entreprises choisir, plutôt qu'imposer une règle unique à tout le monde."]],
qs:[
{q:"Selon le premier intervenant, les expériences montrent que…",o:["la productivité a baissé","la productivité s'est maintenue et le stress a diminué","les salariés travaillent plus"],a:1},
{q:"Quelle est la première objection du second intervenant ?",o:["Les chiffres sont faux","Les études concernent surtout des emplois de bureau","Les salariés n'en veulent pas"],a:1},
{q:"Dans quel secteur travaille le second intervenant ?",o:["La restauration","Le commerce en ligne","L'industrie"],a:0},
{q:"Quelle solution propose le premier intervenant ?",o:["Des aides de l'État","Des jours de repos en rotation","Des journées plus longues"],a:1},
{q:"Quelle est la position finale du second intervenant ?",o:["Il faut une loi pour tous","Il faut laisser chaque entreprise décider","Il faut abandonner l'idée"],a:1}]},

{id:"co6",titre:"Les jeunes et la lecture",type:"Chronique radio",ecoutes:2,segs:[
["A","On entend souvent que les jeunes ne lisent plus. Les chiffres racontent une histoire un peu différente. Selon plusieurs enquêtes, les quinze vingt-cinq ans lisent toujours, mais différemment : moins de romans classiques, davantage de mangas, de bandes dessinées et de littérature pour jeunes adultes. Les réseaux sociaux jouent ici un rôle inattendu : sur certaines plateformes, des vidéos de quelques secondes où des lecteurs partagent leurs coups de cœur font exploser les ventes de titres parfois publiés il y a plusieurs années. Les libraires l'ont bien compris et consacrent désormais des tables entières à ces livres recommandés en ligne. Reste une inquiétude, partagée par de nombreux enseignants : le temps de lecture longue et concentrée diminue, et avec lui, peut-être, la capacité à suivre un raisonnement complexe sur plusieurs pages."]],
qs:[
{q:"Quel est le constat principal de la chronique ?",o:["Les jeunes ne lisent plus du tout","Les jeunes lisent, mais autrement","Les jeunes lisent surtout des classiques"],a:1},
{q:"Quel rôle jouent les réseaux sociaux ?",o:["Ils font baisser les ventes","Ils relancent les ventes de certains livres, même anciens","Ils remplacent les livres"],a:1},
{q:"Comment réagissent les libraires ?",o:["Ils refusent ces livres","Ils leur consacrent des tables entières","Ils ouvrent des boutiques en ligne"],a:1},
{q:"Quelle inquiétude partagent les enseignants ?",o:["La baisse de la lecture longue et concentrée","Le prix des livres","La disparition des bibliothèques"],a:0}]},
{id:"co7",titre:"Des robots pour aider les personnes âgées",type:"Reportage",ecoutes:2,segs:[
["A","Dans cette maison de retraite près de Lille, un petit robot circule depuis six mois entre les chambres. Il rappelle aux résidents l'heure de leurs médicaments, propose des jeux de mémoire et peut alerter le personnel en cas de chute. La directrice est enthousiaste : selon elle, le robot ne remplace personne, mais il libère du temps pour les soignants, qui peuvent se consacrer davantage aux échanges humains. Du côté des résidents, les avis sont partagés. Certains s'amusent à discuter avec lui chaque matin ; d'autres refusent catégoriquement de lui adresser la parole. Une psychologue rappelle que le risque principal n'est pas technique, mais social : si ces machines servent un jour à justifier une réduction du personnel, les personnes âgées seront encore plus isolées. Le prix reste également un obstacle : un robot de ce type coûte l'équivalent de plusieurs mois de salaire d'une aide-soignante."]],
qs:[
{q:"Vrai ou faux : le robot est installé depuis un an.",o:["Vrai","Faux"],a:1,j:"Il circule « depuis six mois »."},
{q:"Que fait le robot ?",o:["Il distribue les repas","Il rappelle les médicaments et peut signaler une chute","Il remplace les infirmières la nuit"],a:1},
{q:"Pour la directrice, le robot…",o:["permet aux soignants de passer plus de temps avec les résidents","permet de réduire le personnel","n'est pas encore utile"],a:0},
{q:"Comment les résidents réagissent-ils ?",o:["Tous l'apprécient","Tous le rejettent","Les avis sont partagés"],a:2},
{q:"Vrai ou faux : pour la psychologue, le principal risque est technique.",o:["Vrai","Faux"],a:1,j:"Le risque principal est « social » : servir à réduire le personnel."},
{q:"Quel autre obstacle est mentionné ?",o:["Le bruit","Le prix","La difficulté d'utilisation"],a:1}]},

{id:"co8",titre:"Peut-on se fier aux avis en ligne ?",type:"Interview",ecoutes:1,segs:[
["A","Aujourd'hui, avant de choisir un restaurant, un hôtel ou même un médecin, beaucoup d'entre nous consultent les avis en ligne. Est-ce une bonne chose, selon vous ?"],
["B","En partie, oui. Les avis ont donné du pouvoir au consommateur : un établissement qui travaille mal ne peut plus se cacher. Mais nous sommes passés d'un outil d'information à une véritable obsession de la note. Certains commerçants me racontent qu'ils vivent dans la peur d'un commentaire négatif."],
["A","On parle aussi beaucoup de faux avis."],
["B","C'est le problème majeur. Des entreprises vendent des commentaires positifs par centaines. Les plateformes affirment les détecter, mais une partie passe forcément entre les mailles du filet. Résultat : la confiance s'effrite."],
["A","Que conseillez-vous aux consommateurs ?"],
["B","De lire les commentaires plutôt que de regarder seulement la note, et de se méfier des avis trop courts ou trop enthousiastes. Et surtout, de garder un peu de place pour la surprise. Le meilleur restaurant de mon quartier n'a presque aucun avis en ligne."]],
qs:[
{q:"Selon l'invitée, les avis en ligne ont d'abord…",o:["donné du pouvoir aux consommateurs","fait baisser les prix","aidé les petits commerçants"],a:0},
{q:"Que ressentent certains commerçants ?",o:["De l'indifférence","De la peur face aux commentaires négatifs","De la fierté"],a:1},
{q:"Vrai ou faux : les plateformes repèrent tous les faux avis.",o:["Vrai","Faux"],a:1,j:"« Une partie passe forcément entre les mailles du filet. »"},
{q:"Quelle est la conséquence des faux avis ?",o:["La confiance diminue","Les ventes augmentent","Les plateformes ferment"],a:0},
{q:"Que conseille-t-elle ?",o:["Ne regarder que la note","Lire les commentaires et se méfier des avis trop enthousiastes","Ne plus consulter d'avis"],a:1},
{q:"Que dit-elle du meilleur restaurant de son quartier ?",o:["Il a d'excellentes notes","Il n'a presque aucun avis en ligne","Il a fermé"],a:1}]},

{id:"co9",titre:"Repartir avec les restes de son repas",type:"Chronique",ecoutes:2,segs:[
["A","Emporter les restes de son repas au restaurant : dans beaucoup de pays, c'est un geste banal. En France, il a longtemps été jugé un peu gênant, comme si l'on manquait d'élégance ou de moyens. Les choses changent pourtant. La loi oblige désormais les restaurants à fournir un contenant aux clients qui le demandent. L'objectif est clair : réduire le gaspillage alimentaire, particulièrement important dans la restauration. Sur le terrain, l'habitude progresse lentement. Beaucoup de clients n'osent toujours pas demander, et certains restaurateurs ne le proposent pas spontanément. Pour encourager le mouvement, des villes ont lancé des campagnes avec des boîtes au design soigné, pour que repartir avec son plat devienne, enfin, un geste élégant."]],
qs:[
{q:"Comment ce geste était-il perçu en France ?",o:["Comme normal","Comme un peu gênant","Comme interdit"],a:1},
{q:"Que prévoit la loi ?",o:["Les restaurants doivent fournir un contenant sur demande","Les clients doivent finir leur assiette","Les restes doivent être donnés aux associations"],a:0},
{q:"Quel est l'objectif de cette mesure ?",o:["Augmenter les ventes","Réduire le gaspillage alimentaire","Améliorer l'hygiène"],a:1},
{q:"Vrai ou faux : la pratique s'est rapidement généralisée.",o:["Vrai","Faux"],a:1,j:"« L'habitude progresse lentement. »"},
{q:"Que font certaines villes ?",o:["Elles distribuent des amendes","Elles proposent des boîtes au design soigné","Elles ferment les restaurants qui gaspillent"],a:1}]},

{id:"co10",titre:"L'autoédition, une révolution ?",type:"Débat radio",ecoutes:1,segs:[
["A","J'ai envoyé mon premier roman à une vingtaine d'éditeurs. Je n'ai reçu que des refus, souvent sans explication. Alors je l'ai publié moi-même, en ligne. En deux ans, j'en ai vendu plus de dix mille exemplaires. Sans l'autoédition, ce livre n'existerait tout simplement pas."],
["B","Je me réjouis pour vous, mais votre cas reste exceptionnel. La grande majorité des livres autoédités se vendent à quelques dizaines d'exemplaires. Et le travail d'un éditeur ne se limite pas à imprimer : il y a la relecture, les corrections, la couverture, la diffusion en librairie."],
["A","Tout cela, on peut aujourd'hui le payer à des professionnels indépendants. Et l'auteur touche une part bien plus importante sur chaque livre vendu."],
["B","À condition d'avoir le temps et l'argent nécessaires. Un auteur qui doit tout gérer seul écrit moins. Je crois que les deux modèles vont coexister, mais il ne faut pas faire croire aux jeunes auteurs que la réussite est facile."]],
qs:[

{id:"co11",titre:"La pollution de l'air",type:"Reportage",ecoutes:2,segs:[
["A","La pollution de l'air reste l'un des principaux problèmes de santé publique en Europe. Les particules fines, émises notamment par le trafic routier, le chauffage au bois et certaines activités industrielles, pénètrent profondément dans les poumons. Elles favorisent les maladies respiratoires et cardiovasculaires. Pour réduire l'exposition des habitants, de nombreuses villes ont créé des zones à faibles émissions, dans lesquelles les véhicules les plus polluants ne peuvent plus circuler. La mesure améliore la qualité de l'air, mais elle suscite des critiques : les ménages modestes, qui possèdent souvent des voitures anciennes, se sentent pénalisés. Les spécialistes insistent sur un point souvent oublié : la pollution intérieure. Dans nos logements, l'air peut être plus pollué qu'à l'extérieur, à cause des produits ménagers, du tabac ou d'une mauvaise aération. Leur conseil est simple : ouvrir les fenêtres au moins dix minutes par jour."]],

["B","Énormément de choses. Les prêts de livres ont légèrement baissé, mais la fréquentation, elle, a augmenté. Les gens ne viennent plus seulement emprunter : ils viennent travailler, réviser, utiliser un ordinateur, faire une démarche administrative, ou simplement se poser au chaud."],

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}catch(e){VOICES=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function hasTTS(){return 'speechSynthesis' in window}
function speakSegs(segs,rate,onend){
  if(!hasTTS()){onend&&onend(false);return}
  try{speechSynthesis.cancel()}catch(e){}
  loadVoices();
  const vA=VOICES.find(v=>/fr[-_]FR/i.test(v.lang))||VOICES[0];
  const vB=VOICES.find(v=>v!==vA);
  const parts=[];
  segs.forEach(s=>{(s[1].match(/[^.!?]+[.!?»]*\s*/g)||[s[1]]).forEach(t=>parts.push([s[0],t.trim()]))});
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p[1]);u.lang='fr-FR';u.rate=rate||1;
    if(p[0]==='B'){if(vB)u.voice=vB;else{if(vA)u.voice=vA;u.pitch=0.7}}else if(vA)u.voice=vA;
    if(i===parts.length-1)u.onend=()=>onend&&onend(true);
    try{speechSynthesis.speak(u)}catch(e){}
  });
}

/* Minuteurs */
const T={};let AC=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function beep(){try{if(!AC)return;[0,0.35,0.7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+0.2)})}catch(e){}}
function timer(id,label,secs){T[id]={left:secs,total:secs,iv:null};return `<div class="timer" id="${id}"><span class="tl">${label}</span><span class="tv">${fmt(secs)}</span><button onclick="tToggle('${id}')">Démarrer</button><button onclick="tReset('${id}')">Réinitialiser</button></div>`}
function tToggle(id){ensureAudio();const t=T[id],el=document.getElementById(id);if(!t||!el)return;const b=el.querySelector('button');
  if(t.iv){clearInterval(t.iv);t.iv=null;b.textContent='Reprendre';return}
  if(t.left<=0)return;b.textContent='Pause';
  t.iv=setInterval(()=>{t.left--;const e=document.getElementById(id);if(!e){clearInterval(t.iv);return}e.querySelector('.tv').textContent=fmt(Math.max(0,t.left));if(t.left<=0){clearInterval(t.iv);t.iv=null;e.classList.add('done');e.querySelector('button').textContent='Terminé';beep()}},1000)}
function tReset(id){const t=T[id],el=document.getElementById(id);if(!t||!el)return;clearInterval(t.iv);t.iv=null;t.left=t.total;el.classList.remove('done');el.querySelector('.tv').textContent=fmt(t.total);el.querySelector('button').textContent='Démarrer'}
function clearTimers(){Object.keys(T).forEach(k=>{clearInterval(T[k].iv);delete T[k]})}

/* Quiz générique */
function quizHTML(qs,p){return qs.map((x,i)=>`<div class="q" id="${p}q${i}"><div class="qt">${i+1}. ${x.q}</div>${x.o.map((o,j)=>`<label><input type="radio" name="${p}${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}
function grade(qs,p){let s=0;qs.forEach((x,i)=>{const box=document.getElementById(p+'q'+i);const c=box.querySelector('input:checked');const labels=box.querySelectorAll('label');labels.forEach(l=>l.classList.remove('ok','ko'));labels[x.a].classList.add('ok');if(c&&+c.value===x.a)s++;else if(c)labels[+c.value].classList.add('ko');box.querySelectorAll('input').forEach(n=>n.disabled=true);if(x.j&&!box.querySelector('.jus'))box.insertAdjacentHTML('beforeend',`<div class="small mut jus">${x.jl||'Justification'} : ${x.j}</div>`)});return s}

/* ---------- Structure en quatre parties (Comprendre, Se préparer, S'entraîner, Prêt pour l'examen) ---------- */
const ETAB={ecoute:S.get('tab_ecoute','comprendre'),oral:S.get('tab_oral','comprendre')};
function tabs(sec){const cur=ETAB[sec];const L=[['comprendre','Comprendre'],['preparer','Se préparer'],['entrainer',"S'entraîner"],['pret',"Prêt pour l'examen"]];
  return `<div class="tabs">${L.map(t=>`<button class="${t[0]===cur?'on':''}" onclick="ETAB.${sec}='${t[0]}';S.set('tab_${sec}','${t[0]}');V.${sec}()">${t[1]}</button>`).join('')}</div>`}
function keep(){document.querySelectorAll('[data-k]').forEach(el=>{el.value=S.get(el.dataset.k,'');el.addEventListener('input',()=>S.set(el.dataset.k,el.value))})}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’]/g,"'").trim();
function speedRow(){return `<div class="row small"><span class="mut">Vitesse</span><select onchange="S.set('rate',+this.value)">${[[0.8,'Lente'],[0.95,'Normale'],[1.1,'Rapide']].map(r=>`<option value="${r[0]}" ${S.get('rate',0.95)==r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div>`}
function transcript(x){return x.segs.map(s=>`<p>${x.segs.length>1?`<b>${s[0]==='A'?'Journaliste':'Invité'}</b> : `:''}${s[1]}</p>`).join('')}

/* ===== ÉCOUTE ===== */
V.ecoute=()=>{
  const t=ETAB.ecoute;let h=`<h1>Compréhension de l'oral</h1>`+tabs('ecoute');
  if(t==='comprendre')h+=`
  <h2>L'épreuve</h2>
  <table><tr><td>Durée</td><td>Environ 30 minutes</td></tr><tr><td>Note</td><td>/25</td></tr>
  <tr><td>Documents</td><td>Enregistrements variés : interview, reportage, débat, extrait de conférence, bulletin d'informations</td></tr>
  <tr><td>Écoutes</td><td>Certains documents sont diffusés deux fois, d'autres une seule fois</td></tr>
  <tr><td>Questions</td><td>À lire avant l'écoute. Choix multiples, vrai ou faux avec justification, réponses courtes</td></tr></table>
  <p class="small mut">Vérifiez le format exact sur le site officiel avant l'examen (voir Ressources).</p>
  <h2>Les savoir-faire</h2>
  <ul><li>Comprendre globalement un document : thème, type de document, situation</li>
  <li>Identifier les locuteurs et leur opinion</li>
  <li>Percevoir les nuances : accord partiel, doute, ironie, concession</li>
  <li>Prendre des notes rapidement</li>
  <li>Repérer les informations factuelles : chiffres, dates, lieux</li>
  <li>Reformuler une information importante avec ses propres mots</li></ul>
  <h2>Comment travailler cette section</h2>
  <table><tr><td><b>Se préparer</b></td><td>Activités pour acquérir chaque savoir-faire : écoute guidée en quatre étapes, repérage des opinions, notation des chiffres.</td></tr>
  <tr><td><b>S'entraîner</b></td><td>Les documents en conditions d'examen : nombre d'écoutes limité, correction à la fin.</td></tr>
  <tr><td><b>Prêt pour l'examen</b></td><td>L'essentiel à mémoriser : mots d'opinion, connecteurs, abréviations, conseils pour le jour J.</td></tr></table>`;
  else if(t==='preparer')h+=`
  <p class="mut">Des activités pour développer chaque savoir-faire, avant de passer aux conditions d'examen.</p>
  ${voiceNote()}${speedRow()}
  <h2>1. Écoute guidée pas à pas</h2>
  <p class="small mut">Avant l'écoute, compréhension globale, détails, puis travail sur la transcription. Écoutes illimitées.</p>
  <div class="list">${CO.map((x,i)=>`<div class="item" onclick="coGuided(${i})"><span><span class="t">${x.titre}</span><br><span class="small mut">${x.type}</span></span><span class="meta">${S.get('cog'+i,0)?'fait':''}</span></div>`).join('')}</div>
  <h2>2. Repérer l'opinion du locuteur</h2>
  <p class="small mut">Huit phrases courtes : le locuteur est-il pour, contre, ou nuancé ?</p>
  <div class="row"><button class="pri" onclick="coOpinion()">Commencer</button></div>
  <h2>3. Noter les chiffres</h2>
  <p class="small mut">Pourcentages, dates, grands nombres : les questions d'examen portent souvent sur ces détails.</p>
  <div class="row"><button class="pri" onclick="coChiffres()">Commencer</button></div>`;
  else if(t==='entrainer'){const co=S.get('co',{});h+=`
  <p class="mut">Conditions d'examen : lisez les questions, puis écoutez. Nombre d'écoutes limité, correction à la fin.</p>
  ${voiceNote()}${speedRow()}
  <div class="row small"><label><input type="checkbox" ${S.get('free',false)?'checked':''} onchange="S.set('free',this.checked)"> Écoutes illimitées</label></div>
  <div class="list">${CO.map((x,i)=>`<div class="item" onclick="coOpen(${i})"><span><span class="t">${x.titre}</span><br><span class="small mut">${x.type}, ${x.ecoutes} écoute${x.ecoutes>1?'s':''}</span></span><span class="meta">${co[x.id]!==undefined?co[x.id]+' %':''}</span></div>`).join('')}</div>
  <p class="small mut" style="margin-top:20px">Complétez avec de vrais enregistrements : RFI et TV5Monde (voir <a href="#ressources">Ressources</a>).</p>`}
  else h+=`
  <h2>Les mots qui annoncent une opinion</h2>
  <table><tr><td>Accord</td><td>Je suis convaincu que, j'approuve, c'est une excellente idée, enfin !</td></tr>
  <tr><td>Désaccord</td><td>Je suis opposé à, je doute que, permettez-moi d'en douter, ça n'a aucun sens</td></tr>
  <tr><td>Nuance</td><td>Sur le papier…, mais ; il y a du bon et du moins bon ; tout dépendra de ; ce n'est pas la priorité</td></tr></table>
  <h2>Les connecteurs à surveiller</h2>
  <table><tr><td>Opposition</td><td>mais, pourtant, cependant, en revanche, or</td></tr>
  <tr><td>Concession</td><td>certes, même si, bien que, il est vrai que</td></tr>
  <tr><td>Conséquence</td><td>donc, c'est pourquoi, si bien que, par conséquent</td></tr>
  <tr><td>Cause</td><td>car, puisque, en raison de, étant donné que</td></tr></table>
  <p class="small mut">Les questions portent souvent sur ce qui suit un connecteur d'opposition.</p>
  <h2>Abréviations pour prendre des notes</h2>
  <table><tr><td>↑ / ↓</td><td>augmentation / baisse</td></tr><tr><td>→</td><td>conséquence, donc</td></tr><tr><td>= / ≠</td><td>égal / différent</td></tr><tr><td>pb, gvt, qqn, qqch</td><td>problème, gouvernement, quelqu'un, quelque chose</td></tr><tr><td>ex., nb, pr, ss</td><td>exemple, nombre, pour, sans</td></tr></table>
  <h2>Le jour J</h2>
  <ul><li>Utilisez le temps de lecture pour souligner les mots-clés de chaque question.</li>
  <li>Première écoute : le sens général. Deuxième écoute : les détails.</li>
  <li>Pour un « vrai ou faux », la justification doit reprendre une information précise du document.</li>
  <li>Ne laissez aucune question sans réponse.</li></ul>`;
  app.innerHTML=h;
};

  <tr><td><b>S'entraîner</b></td><td>Chaque sujet se travaille en six étapes : analyser le document, trouver des arguments, construire le plan, présenter, préparer le débat, s'évaluer.</td></tr>

  <div class="item" onclick="prepRefut()"><span class="t">7. Réfuter une affirmation</span><span class="meta">Défendre son point de vue</span></div>

function poMethode(){
  stopSpeech();clearTimers();
  app.innerHTML=`${back('#oral','Oral')}<h1>Méthode pour la production orale</h1>
  <p class="mut">Le jury n'évalue pas vos idées, mais votre capacité à les exposer et à les défendre. Argumenter, ce n'est pas donner des informations : c'est justifier une opinion avec des idées et des exemples, dans un ordre logique.</p>
  <h2>Pendant les 30 minutes de préparation</h2>
  <table>
  <tr><td>3 min</td><td><b>Comprendre le document.</b> Titre, source, sujet. Posez-vous trois questions : qui est concerné ? de quoi s'agit-il ? pourquoi est-ce un problème ? Le document sert seulement à lancer le sujet : inutile de l'analyser en détail.</td></tr>
  <tr><td>2 min</td><td><b>Formuler la problématique</b> sous forme de question : « Faut-il… ? », « Dans quelle mesure… ? ». C'est le fil conducteur de tout l'exposé.</td></tr>
  <tr><td>8 min</td><td><b>Chercher des idées</b> sans trier : avantages, inconvénients, causes, conséquences, personnes concernées, solutions. Ajoutez des exemples concrets, de votre pays ou de votre vie.</td></tr>
  <tr><td>5 min</td><td><b>Choisir un plan</b> en deux ou trois parties (voir ci-dessous) et placer vos meilleures idées. Gardez les plus convaincantes pour la fin.</td></tr>
  <tr><td>7 min</td><td><b>Préparer les notes.</b> Rédigez entièrement l'introduction et la conclusion. Pour le reste, seulement des mots-clés et les connecteurs : sinon vous lirez au lieu de parler.</td></tr>
  <tr><td>5 min</td><td><b>Anticiper le débat.</b> Notez trois objections que l'examinateur pourrait vous faire, et une réponse à chacune.</td></tr></table>
  <h2>Trois plans faciles à utiliser</h2>
  <table>
  <tr><td><b>Pour / contre / mon avis</b></td><td>Idéal pour une question fermée (« Faut-il interdire… ? »). Terminez par votre position nuancée.</td></tr>
  <tr><td><b>Avantages / limites / propositions</b></td><td>Utile pour une mesure ou une innovation.</td></tr>
  <tr><td><b>Constat / causes / solutions</b></td><td>Utile pour un problème de société (pollution, isolement…).</td></tr></table>
  <h2>Le monologue (environ 10 minutes)</h2>
  <ul>
  <li><b>Introduction :</b> une phrase d'accroche, la présentation du document, la problématique, l'annonce du plan.</li>
  <li><b>Développement :</b> pour chaque partie, un argument, une explication, un exemple, puis une transition vers la partie suivante.</li>
  <li><b>Conclusion :</b> un bilan rapide, une réponse claire à la problématique, et éventuellement une ouverture.</li></ul>
  <h2>Le débat (environ 10 minutes)</h2>
  <ul>
  <li>Écoutez la question jusqu'au bout. Si vous n'avez pas compris, demandez de répéter ou reformulez : c'est valorisé, pas pénalisé.</li>
  <li>L'examinateur peut défendre l'opinion inverse pour vous faire réagir. Gardez votre position, mais acceptez de faire des concessions (« Vous avez raison sur ce point, néanmoins… »).</li>
  <li>Développez vos réponses : une phrase ne suffit pas, ajoutez une justification et un exemple.</li></ul>
  <h2>Erreurs fréquentes</h2>
  <ul>
  <li>Résumer le document au lieu de donner son avis.</li>
  <li>Lire ses notes, sans regarder l'examinateur.</li>
  <li>Accumuler des exemples sans les relier à une idée.</li>
  <li>Parler trop vite par stress : faites des pauses, elles montrent que vous maîtrisez votre discours.</li></ul>
  <div class="row"><button class="pri" onclick="poTirage()">S'entraîner avec un tirage</button><button onclick="poPhrases()">Phrases utiles</button></div>`;
}

let VS={t:0,i:0,f:false,rev:false};
V.vocabulaire=()=>{VS={t:VS.t,i:0,f:false,rev:VS.rev};vocRender()};
function vocCards(){const vk=S.get('vk',[]);const all=VOC[VS.t][1].map((c,i)=>({c,id:VS.t+'-'+i}));return VS.rev?all.filter(x=>!vk.includes(x.id)):all}
function vocRender(){
  const cards=vocCards(),vk=S.get('vk',[]);
  if(VS.i>=cards.length)VS.i=0;
  const cur=cards[VS.i];
  app.innerHTML=`<h1>Vocabulaire</h1><p class="mut">Cliquez sur la carte pour la retourner.</p>
  <div class="row"><select onchange="VS.t=+this.value;VS.i=0;VS.f=false;vocRender()">${VOC.map((t,i)=>`<option value="${i}" ${i===VS.t?'selected':''}>${t[0]} (${t[1].filter((_,j)=>vk.includes(i+'-'+j)).length}/${t[1].length})</option>`).join('')}</select>
  <label class="small"><input type="checkbox" ${VS.rev?'checked':''} onchange="VS.rev=this.checked;VS.i=0;VS.f=false;vocRender()"> Seulement les mots à revoir</label></div>
  ${cur?`<div class="card" onclick="VS.f=!VS.f;vocRender()"><div class="w">${cur.c[0]}</div>${VS.f?`<div class="d">${cur.c[1]}</div><div class="ex">${cur.c[2]}</div>`:'<div class="small mut" style="margin-top:10px">définition et exemple au verso</div>'}</div>
  <div class="row" style="justify-content:space-between"><span class="small mut">${VS.i+1}/${cards.length}</span><span class="row" style="margin:0"><button onclick="say(vocCards()[VS.i].c[0]+'. '+vocCards()[VS.i].c[2])">Écouter</button><button onclick="vocMark(false)">À revoir</button><button class="pri" onclick="vocMark(true)">Je sais</button></span></div>`
  :`<div class="box">Tous les mots de ce thème sont maîtrisés. Décochez « Seulement les mots à revoir » pour les réviser quand même.</div>`}`;

function vocMark(k){const cards=vocCards();const id=cards[VS.i].id;let vk=S.get('vk',[]);vk=vk.filter(x=>x!==id);if(k)vk.push(id);S.set('vk',vk);if(!(VS.rev&&k))VS.i++;VS.f=false;vocRender()}

V.plan=()=>{app.innerHTML=`<h1>Plan sur six mois</h1><p class="mut">Environ 45 minutes par jour, six jours par semaine. L'oral et l'écoute ont la priorité.</p>

<table><tr><th>Jour</th><th>Activité</th></tr>

<h2>Étapes</h2>

<tr><td>Mois 2</td><td><b>Structure de l'oral.</b> Entraînez-vous à toujours suivre le même schéma : problématique, plan, deux arguments, exemples, conclusion. Écoutez d'abord sans transcription, puis avec.</td></tr>
<tr><td>Mois 3</td><td><b>Fluidité.</b> Shadowing 10 min par jour (répéter en même temps que l'audio). À l'oral, réduisez le temps de préparation à 20 min pour gagner en réactivité.</td></tr>
<tr><td>Mois 4</td><td><b>Documents authentiques.</b> Passez à des émissions à débit normal (France Culture, France Inter). Deuxième examen blanc. Débats à l'oral avec un partenaire si possible.</td></tr>
<tr><td>Mois 5</td><td><b>Conditions réelles.</b> Examens blancs toutes les deux semaines, avec les sujets officiels de France Éducation international. Une production écrite par semaine.</td></tr>
<tr><td>Mois 6</td><td><b>Révision.</b> Revoyez les mots « à revoir » et vos erreurs de grammaire récurrentes. Dernier examen blanc dix jours avant. Pas de nouveaux contenus la dernière semaine.</td></tr></table>
<h2>Conseils pour l'oral</h2><ul>
<li>Suivez toujours la même <a href="javascript:void 0" onclick="poMethode()">méthode</a> de préparation : à l'examen, vous n'aurez pas à réfléchir à l'organisation.</li>
<li>Parlez à voix haute à chaque séance : réfléchir dans sa tête ne remplace pas la pratique.</li>
<li>Réécoutez vos enregistrements et notez trois erreurs à corriger la fois suivante.</li>
<li>Pendant le débat, ne cherchez pas à convaincre à tout prix : le jury évalue votre capacité à argumenter et à nuancer.</li>
<li>Un tandem linguistique ou un club de conversation est très utile pour la partie interaction.</li></ul>
<h2>Conseils pour l'écoute</h2><ul>
<li>Lisez toujours les questions avant d'écouter : elles annoncent le contenu.</li>
<li>À la première écoute, repérez le thème et les intervenants ; à la seconde, les détails (chiffres, opinions, nuances).</li>
<li>Faites attention aux connecteurs (mais, cependant, en revanche) : les questions portent souvent sur ce qui suit.</li></ul>`};
